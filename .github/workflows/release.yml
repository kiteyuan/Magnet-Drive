name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: "27.3.13750724"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 代码签名 / 公证可按需取消注释并配置 Secrets：
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: "纸鸢下载 v__VERSION__"
          releaseBody: |
            纸鸢下载客户端（WebView 壳）。

            启动后加载：https://mybt.kiteyuan.info

            ## 安装包说明
            - **Windows**：`.msi` / `.exe`（NSIS）
            - **macOS**：`.dmg`（Apple Silicon 与 Intel 分别构建）
            - **Linux**：`.deb` / `.AppImage`
            - **Android**：`.apk`（aarch64；侧载安装，未上架应用商店）

            > macOS 未公证时，首次打开可能需在「系统设置 → 隐私与安全性」中允许。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-android:
    name: Android APK
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK / platform / build-tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Initialize Android project
        working-directory: desktop
        run: npx tauri android init --ci

      - name: Apply launcher icons
        working-directory: desktop
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Configure Android signing
        working-directory: desktop
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GEN=src-tauri/gen/android
          KEYSTORE="$RUNNER_TEMP/android-release.jks"

          if [ -n "${ANDROID_KEY_BASE64:-}" ]; then
            echo "Using release keystore from secrets."
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$KEYSTORE"
            ALIAS="${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS required when ANDROID_KEY_BASE64 is set}"
            PASS="${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD required when ANDROID_KEY_BASE64 is set}"
          else
            echo "::warning::No ANDROID_KEY_BASE64 secret — signing with a CI-generated keystore (sideload OK; not for Play Store)."
            ALIAS=upload
            PASS=android
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Zhiyuan Download,O=Kiteyuan,C=CN"
          fi

          cat > "$GEN/keystore.properties" <<EOF
          password=$PASS
          keyAlias=$ALIAS
          storeFile=$KEYSTORE
          EOF

          # Strip leading spaces introduced by workflow indentation
          sed -i 's/^[[:space:]]*//' "$GEN/keystore.properties"
          cat "$GEN/keystore.properties"
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          print("---- build.gradle.kts (head) ----")
          print("\n".join(text.splitlines()[:80]))
          print("---- end head ----")

          if "signingConfig = signingConfigs.getByName(\"release\")" in text:
              print("Release signingConfig already present")
              raise SystemExit(0)

          if "import java.io.FileInputStream" not in text:
              if "import java.util.Properties" not in text:
                  raise SystemExit("Expected Properties import missing")
              text = text.replace(
                  "import java.util.Properties",
                  "import java.io.FileInputStream\nimport java.util.Properties",
                  1,
              )

          if "signingConfigs" not in text:
              m = re.search(r"^([ \t]*)buildTypes\s*\{", text, re.M)
              if not m:
                  raise SystemExit("buildTypes block not found in build.gradle.kts")
              ind = m.group(1)
              signing = (
                  f"{ind}signingConfigs {{\n"
                  f"{ind}    create(\"release\") {{\n"
                  f"{ind}        val keystorePropertiesFile = rootProject.file(\"keystore.properties\")\n"
                  f"{ind}        val keystoreProperties = Properties()\n"
                  f"{ind}        if (keystorePropertiesFile.exists()) {{\n"
                  f"{ind}            keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
                  f"{ind}        }}\n"
                  f"{ind}        keyAlias = keystoreProperties[\"keyAlias\"] as String\n"
                  f"{ind}        keyPassword = keystoreProperties[\"password\"] as String\n"
                  f"{ind}        storeFile = file(keystoreProperties[\"storeFile\"] as String)\n"
                  f"{ind}        storePassword = keystoreProperties[\"password\"] as String\n"
                  f"{ind}    }}\n"
                  f"{ind}}}\n"
              )
              text = text[: m.start()] + signing + text[m.start() :]

          m = re.search(r'getByName\("release"\)\s*\{', text)
          if not m:
              raise SystemExit("release buildType block not found")
          after = text[m.end() :]
          next_line = after.lstrip("\n").split("\n", 1)[0]
          ind_match = re.match(r"[ \t]*", next_line)
          ind = ind_match.group(0) if ind_match else "        "
          injection = f"\n{ind}signingConfig = signingConfigs.getByName(\"release\")"
          text = text[: m.end()] + injection + text[m.end() :]

          path.write_text(text, encoding="utf-8")
          print("Patched build.gradle.kts with release signingConfig")
          PY

      - name: Build and upload Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        with:
          projectPath: desktop
          mobile: android
          # 主流手机架构；需要更小体积可改成 --split-per-abi
          args: --apk --target aarch64
          tagName: v__VERSION__
          releaseName: "纸鸢下载 v__VERSION__"
          releaseBody: |
            纸鸢下载客户端（WebView 壳）。

            启动后加载：https://mybt.kiteyuan.info

            ## 安装包说明
            - **Windows**：`.msi` / `.exe`（NSIS）
            - **macOS**：`.dmg`（Apple Silicon 与 Intel 分别构建）
            - **Linux**：`.deb` / `.AppImage`
            - **Android**：`.apk`（aarch64；侧载安装，未上架应用商店）

            > macOS 未公证时，首次打开可能需在「系统设置 → 隐私与安全性」中允许。
          releaseDraft: false
          prerelease: false
