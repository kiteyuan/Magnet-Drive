[package]
name = "zhiyuan-download"
version = "0.1.3"
description = "纸鸢下载桌面客户端（WebView 壳）"
authors = ["kiteyuan"]
edition = "2021"

[lib]
name = "zhiyuan_download_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
